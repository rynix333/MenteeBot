name: release
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: python -m py_compile hello_world.py
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-github-deploy
          aws-region: eu-west-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.ecr.outputs.registry }}/mentibot:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max